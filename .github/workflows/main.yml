name: CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Same-repository PRs are covered by the push run; only fork PRs need the pull_request run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        target: [eval, js, hl, cpp, jvm, php, python, neko, lua]
        exclude:
          # php is not available by default for macos runners, probably not worth bothering
          - os: macos-latest
            target: php
          # Lua is annoying to set up on Windows, so only run it on Linux and macOS
          - os: windows-latest
            target: lua
    runs-on: ${{ matrix.os }}
    # The slowest jobs (cpp) take around 15 minutes, everything above that is a hang.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: HaxeFoundation/setup-haxe@v2
        with:
          haxe-version: "latest"

      - name: Setup hashlink
        if: matrix.target == 'hl'
        uses: HaxeFoundation/setup-hashlink@v1
        with:
          version: nightly

      - name: Check hashlink
        if: matrix.target == 'hl'
        run: hl --version

      - name: Setup Lua
        if: matrix.target == 'lua'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get install -y lua5.4
            sudo update-alternatives --set lua-interpreter /usr/bin/lua5.4
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install lua
          fi

      - name: Setup haxelib
        run: |
          haxelib newrepo
          ${{ matrix.target != 'jvm' }} || haxelib install hxjava
          ${{ matrix.target != 'cpp' }} || haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp.git
          ${{ matrix.target != 'cpp' }} || haxe --cwd .haxelib/hxcpp/git/tools/hxcpp compile.hxml
          ${{ matrix.target != 'cpp' }} || haxelib git hxcpp_luv_io https://github.com/Aidan63/hxcpp_luv_io
          haxelib dev hxcoro .
          haxelib list
          haxe -version
          neko -version

      # hxcpp's compile cache stores object files by a hash of the source, its headers, the
      # flags and the compiler version, so objects that match are reused, from earlier runs as
      # well as between the suites of this job. Most generated files don't change between
      # commits. Objects depend on the hxcpp headers, so a new hxcpp revision starts a new cache.
      - name: Configure hxcpp compile cache
        if: matrix.target == 'cpp'
        id: hxcpp-cache
        shell: bash
        run: |
          echo "HXCPP_COMPILE_CACHE=$RUNNER_TEMP/hxcpp-cache" >> "$GITHUB_ENV"
          # hxcpp evicts the least recently used objects above this size (default 1000).
          echo "HXCPP_CACHE_MB=2500" >> "$GITHUB_ENV"
          echo "key=hxcpp-${{ runner.os }}-${{ runner.arch }}-$(git -C .haxelib/hxcpp/git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore hxcpp compile cache
        if: matrix.target == 'cpp'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/hxcpp-cache
          key: ${{ steps.hxcpp-cache.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.hxcpp-cache.outputs.key }}-

      # clang validates a precompiled header against the modification times of the headers it
      # was built from, which a fresh hxcpp checkout never matches, so a restored PCH fails every
      # build on macOS. Delete them, hxcpp rebuilds them in seconds. GCC and MSVC don't check.
      # An exclusion in the cache paths doesn't work for this: actions/cache archives the whole
      # directory regardless.
      - name: Remove restored precompiled headers
        if: matrix.target == 'cpp' && runner.os == 'macOS'
        shell: bash
        run: find "$HXCPP_COMPILE_CACHE" -name '*.pch' -print -delete 2>/dev/null || true

      - name: Run tests
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"

          # Keep going after a failing variant so that every variant reports its results,
          # then fail the step at the end.
          failed=0
          check() {
            "$@" || failed=1
          }

          run_release() {
            check haxe --cwd tests build-$TARGET.hxml --hxb bin/test.hxb
          }

          # Run with the default dispatcher for this target
          run_default() {
            check haxe --cwd tests -debug -D coro.stack-traces build-$TARGET.hxml
            run_release
            check haxe --cwd tests build-$TARGET.hxml --hxb-lib bin/test.hxb
          }

          # Run again with an alternative dispatcher (env var read at runtime by Main.hx)
          # For cpp: hxcpp incremental compilation skips the C++ rebuild and re-runs the
          # existing binary with the new HXCORO_DISPATCHER value inherited from the environment.
          # For other targets: a quick recompile and re-run.
          run_extra() {
            check env HXCORO_DISPATCHER=$1 haxe --cwd tests build-$TARGET.hxml
          }

          case "$TARGET" in
            eval)
              run_default
              run_extra trampoline
              run_extra threadpool
              # All builds use the paged PagedDeque implementation that users get. Eval is
              # fast, so it also covers the alternative VecDeque-based one while it exists.
              check haxe --cwd tests build-$TARGET.hxml -D use-vec-deque
              ;;
            cpp)
              run_release
              run_extra trampoline
              run_extra threadpool
              ;;
            hl|jvm)
              run_default
              run_extra trampoline
              ;;
            python)
              run_default
              run_extra threadpool
              ;;
            *)
              run_default
              ;;
          esac

          exit $failed

      - name: Run callstack tests
        # Also run when the main tests failed, they are independent.
        if: success() || failure()
        run: haxe --cwd callstack-tests build-${{ matrix.target }}.hxml

      - name: Run thread tests
        # Only threaded targets have a build file for this suite.
        if: (success() || failure()) && contains(fromJSON('["eval", "hl", "cpp", "jvm", "python", "neko"]'), matrix.target)
        run: haxe --cwd thread-tests build-${{ matrix.target }}.hxml

      - name: Run example tests
        if: success() || failure()
        shell: bash
        run: |
          failed=0
          for hxml in examples/*/build-${{ matrix.target }}.hxml; do
            [ -e "$hxml" ] || continue
            echo "::group::$hxml"
            haxe --cwd "$(dirname "$hxml")" "$(basename "$hxml")" || failed=1
            echo "::endgroup::"
          done
          exit $failed

      # Keep the cache small, the next run deletes them anyway.
      - name: Remove precompiled headers before saving
        if: (success() || failure()) && matrix.target == 'cpp' && runner.os == 'macOS'
        shell: bash
        run: find "$HXCPP_COMPILE_CACHE" -name '*.pch' -delete 2>/dev/null || true

      - name: Save hxcpp compile cache
        # Objects compiled before a test failure are as valid as any other.
        if: (success() || failure()) && matrix.target == 'cpp'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hxcpp-cache
          key: ${{ steps.hxcpp-cache.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}

  known-failures:
    # Runs the tests in tests/src/review and thread-tests/src/review, which demonstrate known
    # bugs and are expected to fail. The steps are allowed to fail, so this job never fails the
    # workflow. The list of failing tests is shown in the job summary.
    # Same-repository PRs are covered by the push run; only fork PRs need the pull_request run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: kLabz/setup-haxe@neko-latest
        with:
          haxe-version: "latest"

      - name: Setup haxelib
        run: |
          haxelib newrepo
          haxelib dev hxcoro .

      - name: Run known failures
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          haxe --cwd tests build-eval.hxml -D hxcoro-known-failures 2>&1 | tee known-failures.log

      - name: Run known thread failures
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          haxe --cwd thread-tests build-eval.hxml -D hxcoro-known-failures 2>&1 | tee known-thread-failures.log

      - name: Summarize known failures
        if: always()
        shell: bash
        run: |
          summarize() {
            echo "### $1"
            echo
            echo '```'
            if grep -q '^Failures:' "$2"; then
              sed -n '/^Failures:/,$p' "$2"
            else
              tail -n 20 "$2"
            fi
            echo '```'
            echo
          }
          {
            echo "## Known failures"
            echo
            echo "These tests in \`tests/src/review\` and \`thread-tests/src/review\` demonstrate known bugs. Failures here don't fail the workflow."
            echo
            summarize "tests" known-failures.log
            summarize "thread-tests" known-thread-failures.log
          } >> "$GITHUB_STEP_SUMMARY"
